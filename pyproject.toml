[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verus-oracle"
version = "0.1.0"
description = "Verifiability oracle for Verus: scores a Rust file for ease of Verus verification."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mark Athiri" }]
dependencies = [
    "anthropic>=0.40,<1",
    "tree-sitter>=0.23,<1",
    "tree-sitter-rust>=0.23,<1",
    "click>=8.1,<9",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
server = ["fastapi>=0.111,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "numpy>=1.26"]

[project.scripts]
verus-oracle = "verus_oracle.cli:main"

[tool.setuptools.packages.find]
include = ["verus_oracle*"]

[tool.setuptools.package-data]
verus_oracle = ["taxonomy/prompts/*.md", "web/*.html", "../data/*.json", "../data/*.jsonl"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live_llm: hits the real LLM (skipped by default)"]
addopts = "-m 'not live_llm'"
